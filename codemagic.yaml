workflows:
  android-release:
    name: Controle Corporal - APK Pessoal
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - mestre_tabuada_release
      vars:
        PACKAGE_NAME: "com.danielmarkpsn.controlecorporal"

    cache:
      cache_paths:
        - $HOME/.gradle/wrapper
        - $HOME/.gradle/caches

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Definir localização do Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Limpar caches
        script: |
          gradle clean

      - name: Build do APK pessoal
        script: |
          gradle assembleRelease

    artifacts:
      - app/build/outputs/**/*.apk

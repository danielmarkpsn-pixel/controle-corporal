workflows:
  android-release:
    name: Controle Corporal - Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - mestre_tabuada_release
      vars:
        PACKAGE_NAME: "com.danielmarkpsn.controlecorporal"

    cache:
      cache_paths:
        - $HOME/.gradle/wrapper

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Definir localização do Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Preparar Gradle
        script: |
          GRADLE_VERSION="8.9"
          curl -fsSL "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-$GRADLE_VERSION/bin/gradle wrapper --gradle-version $GRADLE_VERSION
          chmod +x ./gradlew

      - name: Limpar caches e verificar dependências
        script: |
          ./gradlew clean --refresh-dependencies

      - name: Build do AAB de release
        script: |
          ./gradlew bundleRelease --refresh-dependencies

      - name: Build do APK de teste
        script: |
          ./gradlew assembleRelease --refresh-dependencies

    artifacts:
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/*.apk
